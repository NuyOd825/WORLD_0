<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORLD_0</title>
    <!-- 화면 모양(색, 위치)은 style.css가 담당합니다. -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 왼쪽 위: 우주를 관찰하는 창. 값을 바꾸지 않고 보여주기만 합니다. -->
    <aside id="hud" class="hud">
      <div id="world-name"></div>
      <div id="day"></div>
      <div id="objects"></div>
      <div id="laws"></div>
      <div id="step"></div>
      <div id="probability"></div>
    </aside>

    <!-- 검은 화면: 위치별 |ψ|² 를 읽어서 그릴 뿐, 상태를 바꾸지 않습니다. -->
    <canvas id="view" aria-hidden="true"></canvas>

    <!-- 상태와 법칙, 화면 갱신은 world.js가 담당합니다. -->
    <script src="world.js"></script>
  </body>
</html>
